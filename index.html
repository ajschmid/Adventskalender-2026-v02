<!DOCTYPE html>
<html lang="de">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>Weihnachtsbaum Adventskalender</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<header>
		<h1>Unser Weihnachtsbaum-<wbr>Adventskalender</h1>
		<p class="subtitle">Erinnerungen aus vergangenen Jahren</p>
		<p class="countdown" id="countdown"></p>
		<p class="score" id="score"></p>
	</header>

	<main class="calendar" id="calendar"></main>

	<div class="toast" id="toast" role="status" aria-live="polite"></div>

	<div class="overlay" id="overlay" aria-hidden="true">
		<button class="close-button" id="closeButton" aria-label="Schließen">×</button>
		<button class="nav-button prev" id="prevButton" aria-label="Vorheriges Foto">‹</button>
		<button class="nav-button next" id="nextButton" aria-label="Nächstes Foto">›</button>

		<div class="overlay-content" id="overlayContent">
			<figure class="polaroid">
				<img id="overlayImage" src="" alt="">

				<figcaption id="caption">
					<div class="guess" id="guessPanel">
						<output id="guessValue" for="guessSlider">2015</output>
						<input type="range" id="guessSlider" min="2000" max="2026" value="2015"
							aria-label="Dein Tipp für das Jahr">
					</div>

					<div class="result" id="resultPanel" hidden>
						<div id="yearText"></div>
						<div id="resultDetail"></div>
					</div>
				</figcaption>
			</figure>

			<div class="controls">
				<button id="skipButton" class="secondary">Nur Jahr zeigen</button>
				<button id="yearButton" class="primary">Tipp abgeben</button>
				<button id="soundButton" class="sound" aria-label="Musik an/aus">
					<span class="eq"><i></i><i></i><i></i></span>
				</button>
			</div>
		</div>
	</div>

	<audio id="audioPlayer" loop></audio>

	<script src="script.js"></script>
</body>

</html>
